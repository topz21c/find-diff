<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Notion TODO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fffde7;--bg2:#fff9c4;--border:#f9a825;--text:#3e2723;
  --done:#aaa;--btn:#f9a825;--btn-h:#f57f17;--shadow:rgba(0,0,0,.15);
  --badge:#e65100;--check:#43a047;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  user-select:none;
}
.widget{
  width:100%;max-width:360px;margin:0 auto;
  background:var(--bg);
  box-shadow:3px 3px 12px var(--shadow),0 1px 3px var(--shadow);
  border-radius:4px;
  min-height:100vh;
  display:flex;flex-direction:column;
}
.header{
  background:var(--btn);padding:10px 12px 8px;
  border-radius:4px 4px 0 0;
  display:flex;align-items:center;gap:8px;
  cursor:default;
}
.header-title{font-size:14px;font-weight:700;flex:1;color:#3e2723}
.header-actions{display:flex;gap:6px}
.icon-btn{
  background:none;border:none;font-size:16px;cursor:pointer;
  padding:2px 4px;border-radius:4px;line-height:1;color:#3e2723;
  opacity:.7;transition:opacity .15s
}
.icon-btn:hover{opacity:1;background:rgba(0,0,0,.1)}
.progress-bar{height:3px;background:var(--bg2)}
.progress-fill{height:3px;background:#43a047;transition:width .3s;border-radius:0 2px 2px 0}
.stats{
  font-size:11px;color:#795548;padding:5px 12px 4px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(249,168,37,.3);
}
.todo-list{flex:1;overflow-y:auto;padding:6px 0}
.todo-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 12px;
  border-bottom:1px solid rgba(249,168,37,.15);
  cursor:pointer;
  transition:background .1s;
}
.todo-item:hover{background:var(--bg2)}
.todo-item:last-child{border-bottom:none}
.check{
  width:18px;height:18px;border:2px solid #bbb;border-radius:4px;
  flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.todo-item.done .check{background:var(--check);border-color:var(--check);color:#fff;font-size:12px}
.todo-text{font-size:13px;line-height:1.45;flex:1;color:var(--text);transition:color .15s}
.todo-item.done .todo-text{color:var(--done);text-decoration:line-through}
.del-btn{
  background:none;border:none;font-size:14px;cursor:pointer;
  color:#ccc;opacity:0;transition:opacity .15s;padding:0 2px;align-self:flex-start
}
.todo-item:hover .del-btn{opacity:.7}
.del-btn:hover{opacity:1!important;color:#e53935}

/* 빈 상태 */
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;gap:10px;color:#bbb;font-size:13px;text-align:center;
}
.empty-ico{font-size:40px;opacity:.5}

/* 붙여넣기 영역 */
.paste-area{
  border-top:1px solid rgba(249,168,37,.4);padding:10px 12px;
  background:var(--bg2);
}
.paste-label{font-size:11px;color:#795548;margin-bottom:5px;font-weight:600}
.paste-box{
  width:100%;min-height:60px;max-height:100px;
  border:1px solid var(--border);border-radius:6px;
  background:#fff;padding:7px 9px;
  font-size:12px;color:#3e2723;line-height:1.5;
  resize:none;outline:none;
  font-family:inherit;
}
.paste-box:focus{border-color:#f57f17;box-shadow:0 0 0 2px rgba(249,168,37,.25)}
.paste-box::placeholder{color:#ccc}
.paste-btns{display:flex;gap:6px;margin-top:6px}
.paste-btn{
  flex:1;padding:6px;font-size:12px;font-weight:600;
  border:none;border-radius:6px;cursor:pointer;transition:all .15s
}
.paste-btn.primary{background:var(--btn);color:#3e2723}
.paste-btn.primary:hover{background:var(--btn-h);color:#fff}
.paste-btn.secondary{background:#fff;border:1px solid #ddd;color:#888}
.paste-btn.secondary:hover{background:#f5f5f5}

/* 직접 입력 */
.add-row{display:flex;gap:6px;padding:8px 12px;border-top:1px solid rgba(249,168,37,.3)}
.add-input{
  flex:1;border:1px solid rgba(249,168,37,.5);border-radius:6px;
  padding:6px 9px;font-size:13px;background:#fff;outline:none;font-family:inherit
}
.add-input:focus{border-color:var(--btn);box-shadow:0 0 0 2px rgba(249,168,37,.2)}
.add-btn{
  background:var(--btn);border:none;border-radius:6px;
  padding:6px 10px;font-size:16px;cursor:pointer;transition:background .15s
}
.add-btn:hover{background:var(--btn-h)}

/* 팝업 힌트 */
.popup-hint{
  font-size:10px;color:#aaa;text-align:center;padding:5px;
  border-top:1px solid rgba(249,168,37,.2)
}
.popup-hint a{color:#a67c00;text-decoration:none}
.popup-hint a:hover{text-decoration:underline}

/* 완료 토글 */
.show-done-row{
  display:flex;align-items:center;gap:6px;padding:3px 12px 4px;
  font-size:11px;color:#aaa;cursor:pointer;
}
.show-done-row input{accent-color:var(--check)}

/* 스크롤바 */
.todo-list::-webkit-scrollbar{width:4px}
.todo-list::-webkit-scrollbar-track{background:transparent}
.todo-list::-webkit-scrollbar-thumb{background:rgba(249,168,37,.4);border-radius:4px}

/* 드래그 핸들 느낌용 top strip */
.drag-strip{
  background:var(--btn);text-align:center;font-size:10px;
  color:rgba(0,0,0,.25);padding:2px;letter-spacing:3px;border-radius:4px 4px 0 0
}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="drag-strip">• • •</div>
  <div class="header">
    <span style="font-size:18px">📋</span>
    <span class="header-title" id="list-title">오늘의 TODO</span>
    <div class="header-actions">
      <button class="icon-btn" title="붙여넣기 영역 열기/닫기" onclick="togglePaste()">📥</button>
      <button class="icon-btn" title="완료 항목 모두 삭제" onclick="clearDone()">🗑</button>
      <button class="icon-btn" title="전체 초기화" onclick="clearAll()">↺</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="stats" id="stats">
    <span id="stat-text">TODO 없음</span>
    <label class="show-done-row" style="padding:0">
      <input type="checkbox" id="show-done" onchange="render()" checked>
      <span>완료 표시</span>
    </label>
  </div>

  <div class="todo-list" id="todo-list"></div>

  <div class="add-row">
    <input class="add-input" id="add-input" placeholder="직접 입력..." onkeydown="onAddKey(event)">
    <button class="add-btn" onclick="addManual()">+</button>
  </div>

  <div class="paste-area" id="paste-area" style="display:none">
    <div class="paste-label">📋 노션에서 복사한 내용을 붙여넣으세요</div>
    <textarea class="paste-box" id="paste-box" placeholder="노션 체크박스 항목을 복사(Ctrl+C) 후 여기에 붙여넣기(Ctrl+V)..."></textarea>
    <div class="paste-btns">
      <button class="paste-btn primary" onclick="importPaste()">가져오기</button>
      <button class="paste-btn secondary" onclick="togglePaste()">닫기</button>
    </div>
  </div>

  <div class="popup-hint">
    <a href="#" onclick="openPopup();return false">🪟 작은 창으로 열기</a>
    &nbsp;·&nbsp; 항목 클릭 = 완료 토글
  </div>
</div>

<script>
const STORAGE_KEY = 'notion-todo-v1';
let todos = [];

function load() {
  try { todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { todos = []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function render() {
  const list = document.getElementById('todo-list');
  const showDone = document.getElementById('show-done').checked;
  const visible = todos.filter(t => showDone || !t.done);

  if (!todos.length) {
    list.innerHTML = '<div class="empty"><div class="empty-ico">📝</div><div>TODO가 없어요<br><small>노션에서 복사하거나 직접 입력해보세요</small></div></div>';
  } else if (!visible.length) {
    list.innerHTML = '<div class="empty"><div class="empty-ico">🎉</div><div>모두 완료!</div></div>';
  } else {
    list.innerHTML = '';
    visible.forEach((t, vi) => {
      const realIdx = todos.indexOf(t);
      const div = document.createElement('div');
      div.className = 'todo-item' + (t.done ? ' done' : '');
      div.innerHTML = `
        <div class="check">${t.done ? '✓' : ''}</div>
        <span class="todo-text">${escHtml(t.text)}</span>
        <button class="del-btn" onclick="deleteTodo(${realIdx},event)" title="삭제">✕</button>`;
      div.addEventListener('click', () => toggleTodo(realIdx));
      list.appendChild(div);
    });
  }

  // stats + progress
  const total = todos.length, doneCount = todos.filter(t => t.done).length;
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('stat-text').textContent =
    total ? `${doneCount}/${total} 완료 (${pct}%)` : 'TODO 없음';
}

function toggleTodo(idx) {
  todos[idx].done = !todos[idx].done;
  save(); render();
}
function deleteTodo(idx, e) {
  e.stopPropagation();
  todos.splice(idx, 1);
  save(); render();
}
function clearDone() {
  if (!todos.some(t => t.done)) return;
  if (!confirm('완료된 항목을 모두 삭제할까요?')) return;
  todos = todos.filter(t => !t.done);
  save(); render();
}
function clearAll() {
  if (!todos.length) return;
  if (!confirm('전체 TODO를 삭제할까요?')) return;
  todos = [];
  save(); render();
}

function addManual() {
  const inp = document.getElementById('add-input');
  const text = inp.value.trim();
  if (!text) return;
  todos.push({ text, done: false });
  inp.value = '';
  save(); render();
  // 스크롤 하단
  const list = document.getElementById('todo-list');
  list.scrollTop = list.scrollHeight;
}
function onAddKey(e) {
  if (e.key === 'Enter') addManual();
}

function togglePaste() {
  const pa = document.getElementById('paste-area');
  const open = pa.style.display !== 'none';
  pa.style.display = open ? 'none' : 'block';
  if (!open) setTimeout(() => document.getElementById('paste-box').focus(), 50);
}

function importPaste() {
  const raw = document.getElementById('paste-box').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    // 노션 체크박스: ☐ / ☑ / [ ] / [x] / • / - 등 다양한 패턴 처리
    let done = false;
    let text = line;

    // ☑ 완료 체크박스
    if (/^☑\s*/.test(text)) { done = true; text = text.replace(/^☑\s*/, ''); }
    // ☐ 미완료 체크박스
    else if (/^☐\s*/.test(text)) { text = text.replace(/^☐\s*/, ''); }
    // [x] or [X]
    else if (/^\[x\]\s*/i.test(text)) { done = true; text = text.replace(/^\[x\]\s*/i, ''); }
    // [ ]
    else if (/^\[\s\]\s*/.test(text)) { text = text.replace(/^\[\s\]\s*/, ''); }
    // 노션 plain text 복사 시 앞에 오는 불릿/대시
    else if (/^[-•·]\s+/.test(text)) { text = text.replace(/^[-•·]\s+/, ''); }
    // 숫자 리스트 "1. "
    else if (/^\d+\.\s+/.test(text)) { text = text.replace(/^\d+\.\s+/, ''); }

    text = text.trim();
    if (!text) return;

    // 중복 방지
    if (todos.some(t => t.text === text)) return;
    todos.push({ text, done });
    added++;
  });

  document.getElementById('paste-box').value = '';
  togglePaste();
  save(); render();

  if (added === 0) alert('새로운 항목이 없습니다. (이미 있거나 빈 내용)');
  else {
    const list = document.getElementById('todo-list');
    list.scrollTop = list.scrollHeight;
  }
}

function openPopup() {
  const url = window.location.href.split('?')[0];
  window.open(url, 'notion-todo',
    'width=360,height=600,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no,alwaysRaised=yes');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 키보드 단축키
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'v' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
    togglePaste();
  }
});

load(); render();
</script>
</body>
</html>
